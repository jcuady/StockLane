# StockLane Render blueprint (portfolio). Set APP_KEY + secrets in dashboard.
# Web listens on $PORT via php artisan serve (see backend/Dockerfile).

services:
  - type: web
    name: stocklane-web
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    dockerCommand: web
    plan: free
    healthCheckPath: /up
    envVars:
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "false"
      - key: APP_KEY
        sync: false
      - key: APP_URL
        sync: false
      - key: LOG_CHANNEL
        value: stderr
      - key: RUN_MIGRATIONS
        value: "true"
      - key: DB_CONNECTION
        value: mysql
      - key: DB_HOST
        fromDatabase:
          name: stocklane-db
          property: host
      - key: DB_PORT
        fromDatabase:
          name: stocklane-db
          property: port
      - key: DB_DATABASE
        fromDatabase:
          name: stocklane-db
          property: database
      - key: DB_USERNAME
        fromDatabase:
          name: stocklane-db
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: stocklane-db
          property: password
      - key: SESSION_DRIVER
        value: file
      - key: CACHE_STORE
        value: file
      - key: QUEUE_CONNECTION
        value: database
      - key: FILESYSTEM_DISK
        value: local
      - key: PAYMONGO_WEBHOOK_SECRET
        sync: false
      - key: BUSYBEE_API_KEY
        sync: false
      - key: LOW_STOCK_SMS_TO
        sync: false

  - type: worker
    name: stocklane-worker
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    dockerCommand: worker
    plan: free
    envVars:
      - fromService:
          type: web
          name: stocklane-web
          envVarKey: APP_ENV
      - fromService:
          type: web
          name: stocklane-web
          envVarKey: APP_KEY
      - fromService:
          type: web
          name: stocklane-web
          envVarKey: DB_CONNECTION
      - fromService:
          type: web
          name: stocklane-web
          envVarKey: DB_HOST
      - fromService:
          type: web
          name: stocklane-web
          envVarKey: DB_PORT
      - fromService:
          type: web
          name: stocklane-web
          envVarKey: DB_DATABASE
      - fromService:
          type: web
          name: stocklane-web
          envVarKey: DB_USERNAME
      - fromService:
          type: web
          name: stocklane-web
          envVarKey: DB_PASSWORD
      - key: QUEUE_CONNECTION
        value: database
      - key: RUN_MIGRATIONS
        value: "false"
      - key: LOG_CHANNEL
        value: stderr

databases:
  - name: stocklane-db
    plan: free
    databaseName: stocklane
    user: stocklane
