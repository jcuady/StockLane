# StockLane Render blueprint (free-tier capable).
# Free web + Free Postgres. Queue runs sync on the web process (no free workers).
# Set APP_KEY blank (entrypoint generates Laravel base64 key) and optional webhook secrets.

services:
  - type: web
    name: stocklane-web
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    dockerCommand: web
    plan: free
    healthCheckPath: /up
    envVars:
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "false"
      - key: APP_KEY
        sync: false
      - key: APP_URL
        sync: false
      - key: LOG_CHANNEL
        value: stderr
      - key: RUN_MIGRATIONS
        value: "true"
      - key: DB_CONNECTION
        value: pgsql
      - key: DB_HOST
        fromDatabase:
          name: stocklane-db
          property: host
      - key: DB_PORT
        fromDatabase:
          name: stocklane-db
          property: port
      - key: DB_DATABASE
        fromDatabase:
          name: stocklane-db
          property: database
      - key: DB_USERNAME
        fromDatabase:
          name: stocklane-db
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: stocklane-db
          property: password
      - key: SESSION_DRIVER
        value: database
      - key: CACHE_STORE
        value: database
      - key: QUEUE_CONNECTION
        value: sync
      - key: FILESYSTEM_DISK
        value: local
      - key: PAYMONGO_WEBHOOK_SECRET
        sync: false
      - key: BUSYBEE_API_KEY
        sync: false
      - key: LOW_STOCK_SMS_TO
        sync: false

databases:
  - name: stocklane-db
    plan: free
    databaseName: stocklane
    user: stocklane
